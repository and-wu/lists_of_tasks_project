[project]
name = "lists-of-tasks"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.22.0",
    "apscheduler>=3.11.2",
    "dotenv>=0.9.9",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["RUF001", "RUF002", "D100", "D101", "D102", "D104", "D107"]
exclude = ["tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
